<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Sistem Informasi Akademik</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="login-page d-flex align-items-center justify-content-center min-vh-100">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-12 col-sm-8 col-md-6 col-lg-4">

                <div class="card login-card shadow-sm border-0">

                    <div class="card-body p-4">

                        <!-- Judul -->
                        <div class="text-center mb-4">
                            <h3 class="fw-bold">SIAKAD</h3>

                            <h6>Sistem Informasi Akademik</h6>

                            <p class="text-secondary small">
                                Silakan masuk ke akun Anda
                            </p>
                        </div>

                        <!-- Form Login -->
                        <form id="loginForm"
                              action="dashboard.html"
                              method="post">

                            <!-- Email -->
                            <div class="mb-3">

                                <label for="email" class="form-label">
                                    Email
                                </label>

                                <input type="email"
                                       class="form-control"
                                       id="email"
                                       name="email"
                                       placeholder="Masukkan email"
                                       required>

                            </div>

                            <!-- Password -->
                            <div class="mb-3">

                                <label for="password" class="form-label">
                                    Password
                                </label>

                                <input type="password"
                                       class="form-control"
                                       id="password"
                                       name="password"
                                       placeholder="Masukkan password"
                                       required>

                            </div>

                            <!-- Pesan Login -->
                            <div id="loginMessage"></div>

                            <!-- Tombol Login -->
                            <button type="submit"
                                    class="btn btn-primary w-100">
                                Masuk
                            </button>

                        </form>

                        <!-- Footer -->
                        <div class="text-center mt-4">

                            <small class="text-secondary">
                                Sistem Informasi Akademik &copy; 2026
                            </small>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- Custom JavaScript -->
    <script src="assets/js/database.js"></script>
    <script src="assets/js/auth.js"></script>

</body>
</html>
